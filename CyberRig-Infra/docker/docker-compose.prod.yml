# ==========================================
# CyberRig Enterprise Production Docker Compose
# Task DEVOPS-01 (PB-15)
# Multi-tier Architecture with Strict Network Isolation
# ==========================================

services:
  # ------------------------------------------
  # 1. PostgreSQL Database Service
  # Private internal service - no host port exposure
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberrig_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberrig_db
      POSTGRES_USER: cyberrig_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberrig_prod_secure_pass}
    volumes:
      - cyberrig_pgdata_prod:/var/lib/postgresql/data
    networks:
      - cyberrig-internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberrig_user -d cyberrig_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # 2. Redis In-Memory Cache & Stock Lock Service
  # Password-protected and private internal only
  # ------------------------------------------
  redis:
    image: redis:alpine
    container_name: cyberrig_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cyberrig_prod_redis_pass}", "--appendonly", "yes"]
    volumes:
      - cyberrig_redis_data_prod:/data
    networks:
      - cyberrig-internal
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cyberrig_prod_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------
  # 3. Node.js Production Backend Service (App)
  # Multi-stage built image, non-root user, multi-network bridge
  # ------------------------------------------
  app:
    container_name: cyberrig_app_prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: CyberRig Production API
      DATABASE_URL: postgresql://cyberrig_user:${POSTGRES_PASSWORD:-cyberrig_prod_secure_pass}@postgres:5432/cyberrig_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-cyberrig_prod_redis_pass}@redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberrig-internal
      - cyberrig-public
    expose:
      - "3000"

  # ------------------------------------------
  # 4. Nginx Gateway & Reverse Proxy (Edge)
  # The ONLY service publishing public ports to host
  # ------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cyberrig_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - cyberrig-public

# ------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------
volumes:
  cyberrig_pgdata_prod:
    name: cyberrig_pgdata_prod
  cyberrig_redis_data_prod:
    name: cyberrig_redis_data_prod

# ------------------------------------------
# Isolated Network Topology
# ------------------------------------------
networks:
  # Internal network: Isolated backend data plane (App <-> Postgres <-> Redis)
  cyberrig-internal:
    name: cyberrig_internal_net
    internal: true

  # Public network: Web ingress routing (Nginx <-> App)
  cyberrig-public:
    name: cyberrig_public_net
